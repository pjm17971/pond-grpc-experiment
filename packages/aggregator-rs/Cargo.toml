[package]
name = "aggregator-rs"
version = "0.0.0"
edition = "2021"
publish = false
description = "Rust aggregator for the gRPC experiment: gRPC in, WebSocket out. Uses the pond-rs live layer."

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tonic = "0.12"
prost = "0.13"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memory-stats = "1"
# pond-rs from crates.io; the live layer is behind the `live` feature.
pond-rs = { version = "0.1", features = ["live"] }

[build-dependencies]
tonic-build = "0.12"
